name: Lookup quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lookup-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run nickname regression tests
        run: npm run test:lookup
      - name: Run provider adapter tests
        run: npm run test:provider-adapters
      - name: Run observability privacy tests
        run: npm run test:observability
      - name: Run persistence and rate-limit tests
        run: npm run test:persistence
      - name: Run auth hardening tests
        run: npm run test:auth
      - name: Lint application
        run: npm run lint
      - name: Build Next.js app
        run: npm run build
