name: Lookup persistence tests

on:
  pull_request:
    paths:
      - "src/app/api/lookup/persistence.mjs"
      - "src/app/api/lookup/route.ts"
      - "tests/persistence.test.mjs"
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/lookup-persistence.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/lookup/persistence.mjs"
      - "src/app/api/lookup/route.ts"
      - "tests/persistence.test.mjs"
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/lookup-persistence.yml"

permissions:
  contents: read

concurrency:
  group: lookup-persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    name: Test shared limiter and sanitized logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run persistence regression tests
        run: npm run test:persistence
      - name: Lint application
        run: npm run lint
