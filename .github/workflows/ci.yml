name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: |
          npm run test:lookup
          npm run test:deployment-routing
          npm run test:provider-adapters
          npm run test:lookup-safety
          npm run test:observability
          npm run test:persistence
          npm run test:billing
          npm run test:auth
          npm run test:security
          npm run test:supercell
          npm run test:ts-client
      - name: Production build
        run: npm run build
